<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}IT ticket study{% endblock %}</title>
  <style>
    :root { --ink:#1c2430; --muted:#5b6675; --line:#d8dee8; --bg:#f6f7f9; --accent:#1f5f8b; --warn:#8a2d2d; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 1080px; margin: 0 auto; padding: 24px 20px 64px; }
    h1 { font-size: 1.45rem; margin: 0 0 4px; }
    h2 { font-size: 1.1rem; margin: 28px 0 8px; }
    .muted { color: var(--muted); }
    .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:20px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    @media (max-width: 820px) { .grid { grid-template-columns:1fr; } }
    .col h3 { margin:0 0 8px; font-size:1rem; }
    .box { border:1px solid var(--line); border-radius:8px; padding:14px; background:#fbfcfe; max-height:420px; overflow:auto; white-space:pre-wrap; }
    .ticket { border-left:4px solid var(--accent); padding-left:14px; margin: 18px 0; }
    label { display:block; margin:6px 0; cursor:pointer; }
    fieldset { border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin: 14px 0; }
    legend { font-weight:600; padding:0 6px; }
    textarea { width:100%; min-height:70px; padding:10px; border:1px solid var(--line); border-radius:8px; font:inherit; }
    button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:12px 22px; font-size:1rem; cursor:pointer; }
    button.secondary { background:#fff; color:var(--accent); border:1px solid var(--accent); }
    .bar { height:8px; background:#e6eaf1; border-radius:4px; overflow:hidden; margin:10px 0 22px; }
    .bar > div { height:100%; background:var(--accent); }
    .error { color:var(--warn); font-weight:600; }
    .small { font-size:.88rem; }
    .tag { display:inline-block; background:#eef3f8; color:var(--accent); border-radius:999px; padding:2px 10px; font-size:.8rem; }
    ul.cands { list-style:none; margin:0; padding:0; }
    ul.cands > li { border-bottom:1px solid var(--line); padding:10px 0; }
    ul.cands > li:last-child { border-bottom:0; }
    .cand-title { font-weight:600; }
  </style>
</head>
<body>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
