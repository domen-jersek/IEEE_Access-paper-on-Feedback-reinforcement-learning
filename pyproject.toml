[project]
name = "paper-ieee-access"
version = "0.1.0"
description = "Feedback as a Learnable Retrieval Prior for RAG-based IT Ticket Resolution"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "sentence-transformers>=2.5",
    "faiss-cpu>=1.7",
    "openai>=1.30",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "xgboost>=2.0",
    "rouge-score>=0.1",
    "bert-score>=0.3",
    "transformers>=4.36",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ipykernel>=6.25",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[tool.setuptools.packages.find]
include = ["src*"]